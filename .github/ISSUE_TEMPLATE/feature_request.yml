name: 功能建议
description: 提出新的功能或改进建议。提问、配置求助请不要用这个表单，去项目交流群或 Discussions。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        **提问不要开 Issue。** 用不明白、配置不会、想让别人帮忙看问题 → 去项目交流群，或者项目的 Discussions（如果已开启）。

        **一个 Issue 只讲一个建议。** 几个想法请分开提交，方便分别讨论和排期；混在一起的建议通常没法推进。

        写建议不需要懂实现细节：说清楚你在什么场景下遇到什么麻烦、希望它变成什么样就够了。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么的时候需要这个功能？（做什么事、什么流程、多常用）
      placeholder: 例如：每天要把 A 导到 B，现在得手动点五次。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在卡在哪、有多麻烦、绕路成本多大？先描述问题本身，不用急着想实现方案。
      placeholder: 例如：现在的流程要来回切窗口，容易漏步骤。
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 期望行为
      description: 你希望它表现成什么样？给一个具体例子（什么操作 → 什么结果）最好。
      placeholder: 例如：一条命令就能完成导入，并给出成功/失败结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 你考虑过的其他做法，或者别的工具是怎么解决的。
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: 临时绕法（可选）
      description: 你现在是怎么凑合解决的？（脚本、手动步骤、别的插件都算）
    validations:
      required: false
